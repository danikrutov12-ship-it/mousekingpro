# Сборка образа воркера фейсвапа в GHCR.
# Запускается вручную (workflow_dispatch) или тегом worker-vX.Y.Z.
name: worker

on:
  workflow_dispatch:
  push:
    tags: ['worker-v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mkp-faceswap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
